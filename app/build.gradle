plugins { id 'com.android.application' }

android {
    namespace 'com.lumenfield.viewer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lumenfield.viewer'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '4.3-original-android'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
