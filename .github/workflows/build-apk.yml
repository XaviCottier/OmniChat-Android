name: Build Lumenfield V4 Original Android
on:
  push:
    branches: [lumenfield-v4-android-build]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="lumenfield-v4-original-android-v4"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG"             app/build/outputs/apk/debug/app-debug.apk#ARCHIE-Lumenfield-V4-Original-Android.apk             --title "ARCHIE Lumenfield V4 Original Android"             --notes "Android wrapper for the original Lumenfield V4 frontend. Automatically imports etapa-02-navegacion.zip from Downloads, loads integrated demo by default, supports Android SAF folder selection, and uses immersive mode."             --target "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: ARCHIE-Lumenfield-V4-Original-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
