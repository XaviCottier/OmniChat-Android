name: Bootstrap and build OmniChat APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct and verify source
        shell: bash
        run: |
          cat bootstrap/part{01..06}.b64 | tr -d '\n\r' | base64 --decode > /tmp/omnichat-src.tar.xz
          echo "259a02c2ff1072b0b61910e1018820fc590302f0321b5dbccc4c6ae33c9c65eb  /tmp/omnichat-src.tar.xz" | sha256sum -c -
          tar -xJf /tmp/omnichat-src.tar.xz
      - name: Publish regular source files
        shell: bash
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch bootstrap
          git rm --ignore-unmatch .github/workflows/bootstrap-build.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import OmniChat Android source [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OmniChat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
